services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rovor
      POSTGRES_PASSWORD: rovor
      POSTGRES_DB: rovor
    ports:
      # 5433 on the host to avoid clashing with a locally installed Postgres on 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rovor -d rovor']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
